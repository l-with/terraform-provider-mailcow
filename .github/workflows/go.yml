name: Go

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26

      - name: Build
        run: go build -v ./...

      - name: Test
        env:
          MAILCOW_INSECURE: true
          # Public demo instance and its published API key (see README).
          # Not taken from secrets, because pull requests from forks do not get secrets.
          MAILCOW_HOST_NAME: demo.mailcow.email
          MAILCOW_API_KEY: 390448-22B69F-FA37D9-19701B-6F033F
        run: go test -v ./...
